<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Barrel Climb – heygemm</title>
<style>
  body{margin:0;background:#0a0c10;color:#e8ecf4;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
  canvas{border:2px solid #1e2633;border-radius:12px;background:#000;box-shadow:0 0 40px rgba(255,80,80,.15)}
  .back-home{position:fixed;top:16px;left:16px;background:rgba(0,0,0,.75);color:#f55;border:1px solid #f55;padding:8px 14px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;z-index:100;cursor:pointer}
  .back-home:hover{background:rgba(255,80,80,.18)}
  #info{margin-top:12px;color:#8b95a8;font-size:13px;text-align:center;max-width:520px}
</style>
</head>
<body>
<a class="back-home" id="navBtn" href="../index.html">< home</a>
<canvas id="c" width="480" height="560"></canvas>
<div id="info">← → / A D = lopen • ↑ / W = ladder omhoog • Spatie = springen • bereik de top!</div>
<script>
const WEBSITE_HOME='../index.html';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=560;
const _mem={};
function storageGet(k){try{return localStorage.getItem(k)}catch(e){return _mem[k]||null}}
function storageSet(k,v){try{localStorage.setItem(k,v)}catch(e){_mem[k]=String(v)}}
const LB_KEY='heygemm_barrel_leaderboard';
function loadLB(){try{return JSON.parse(storageGet(LB_KEY)||'[]')}catch{return[]}}
function saveLB(name,sc){
  name=(name||'Anoniem').trim();
  let lb=loadLB();
  const prev=lb.find(e=>(e.name||'').toLowerCase()===name.toLowerCase());
  const best=Math.floor(sc);
  if(prev&&best<=(prev.score||0))return lb;
  lb=lb.filter(e=>(e.name||'').toLowerCase()!==name.toLowerCase());
  lb.push({name:name,score:best,diff:difficulty,date:Date.now()});
  lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,10);
  storageSet(LB_KEY,JSON.stringify(lb));return lb;
}

const DIFFS={
  easy:{label:'EASY',barrelSpeed:1.4,spawn:2.2,scoreMul:0.8},
  medium:{label:'MEDIUM',barrelSpeed:2.1,spawn:1.5,scoreMul:1},
  hard:{label:'HARD',barrelSpeed:3.0,spawn:0.95,scoreMul:1.5}
};
let difficulty=storageGet('heygemm_barrel_diff')||'medium';
if(!DIFFS[difficulty])difficulty='medium';

// Level geometry: platforms + ladders (Donkey Kong-ish)
const PLATS=[
  {x:0,y:520,w:480,h:14},
  {x:0,y:430,w:400,h:12},
  {x:80,y:340,w:400,h:12},
  {x:0,y:250,w:400,h:12},
  {x:80,y:160,w:400,h:12},
  {x:40,y:80,w:200,h:12}
];
const LADDERS=[
  {x:360,y:430,h:90},
  {x:100,y:340,h:90},
  {x:340,y:250,h:90},
  {x:120,y:160,h:90},
  {x:200,y:80,h:80}
];
const GOAL={x:90,y:50,w:40,h:30};

let state='menu',score=0,lives=3,player,barrels,boss,keys={},frame=0,spawnT=0,won=false,respawnT=0;
let playerName=storageGet('heygemm_player_name')||'',nameInput=playerName,nameFocused=false;

function resetLevel(){
  player={x:40,y:490,w:18,h:28,vx:0,vy:0,onGround:false,onLadder:false,facing:1};
  barrels=[];frame=0;spawnT=0;won=false;
  boss={x:60,y:40,throwT:0};
}
function resetGame(){score=0;lives=3;resetLevel()}
function goMenu(){state='menu'}
function goWebsite(){location.href=WEBSITE_HOME}
function startGame(){
  playerName=(nameInput.trim()||'Anoniem').slice(0,12);
  storageSet('heygemm_player_name',playerName);
  storageSet('heygemm_barrel_diff',difficulty);
  resetGame();state='playing';
}
document.getElementById('navBtn').onclick=e=>{e.preventDefault();goWebsite()};

window.addEventListener('keydown',e=>{
  if(state==='menu'&&nameFocused){
    if(e.key==='Enter'){nameFocused=false;e.preventDefault();return}
    if(e.key==='Backspace'){nameInput=nameInput.slice(0,-1);e.preventDefault();return}
    if(e.key.length===1&&nameInput.length<12){nameInput+=e.key;e.preventDefault()}
    return;
  }
  if(state==='menu'&&(e.key==='Enter'||e.key===' ')){startGame();e.preventDefault();return}
  if(state==='respawn'&&(e.key==='Enter'||e.key===' ')){resetLevel();state='playing';e.preventDefault();return}
  if((state==='gameOver'||state==='win')&&(e.key==='Enter'||e.key===' '||e.key==='r')){goMenu();return}
  keys[e.key.toLowerCase()]=true;
  if(['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d',' '].includes(e.key.toLowerCase()))e.preventDefault();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('click',ev=>{
  const r=canvas.getBoundingClientRect(),mx=(ev.clientX-r.left)*(W/r.width),my=(ev.clientY-r.top)*(H/r.height);
  if(state==='menu'){
    if(mx>90&&mx<390&&my>145&&my<180){nameFocused=true;return}
    nameFocused=false;
    // difficulty
    [['easy',100],['medium',190],['hard',280]].forEach(([d,x])=>{
      if(mx>x&&mx<x+90&&my>210&&my<250){difficulty=d;storageSet('heygemm_barrel_diff',d)}
    });
    if(mx>140&&mx<340&&my>280&&my<330)startGame();
    if(mx>140&&mx<340&&my>345&&my<385)goWebsite();
  }
  if(state==='respawn'){resetLevel();state='playing';return}
  if(state==='gameOver'||state==='win')goMenu();
});

function onPlatform(px,py,pw,ph,prevBottom){
  // solid landing: feet cross platform top from above
  const feet=py+ph;
  for(const pl of PLATS){
    if(px+pw>pl.x+4&&px<pl.x+pl.w-4){
      if(prevBottom!==undefined){
        if(prevBottom<=pl.y+2&&feet>=pl.y&&feet<=pl.y+pl.h+10)return pl;
      } else if(feet>=pl.y&&feet<=pl.y+pl.h+8){
        return pl;
      }
    }
  }
  return null;
}
function onLadder(px,py,pw,ph){
  const cx=px+pw/2;
  for(const l of LADDERS){
    if(cx>l.x-6&&cx<l.x+18&&py+ph>l.y&&py<l.y+l.h)return l;
  }
  return null;
}

function update(dt){
  if(state==='respawn'){
    respawnT-=dt;
    if(respawnT<=0){resetLevel();state='playing'}
    return;
  }
  if(state!=='playing')return;
  frame++;
  const cfg=DIFFS[difficulty];
  const p=player;
  const lad=onLadder(p.x,p.y,p.w,p.h);
  // Ladders: only grab when grounded or already climbing — NOT mid-jump
  // (prevents skipping floors by jumping into the ladder above)
  const canGrabLadder = lad && (p.onGround || p.onLadder) && p.vy >= -1.2;
  const wantClimb = keys['arrowup']||keys['w']||keys['arrowdown']||keys['s'];

  if(canGrabLadder && (wantClimb || p.onLadder)){
    p.onLadder=true;
    p.vy=0;p.vx=0;p.onGround=false;
    if(keys['arrowup']||keys['w'])p.y-=2.4;
    if(keys['arrowdown']||keys['s'])p.y+=2.4;
    p.x=lad.x-2;
    // leave ladder at top/bottom
    if(!onLadder(p.x,p.y,p.w,p.h))p.onLadder=false;
  } else {
    if(!lad || p.vy < -1.2) p.onLadder=false;
    if(keys['arrowleft']||keys['a']){p.vx=-2.6;p.facing=-1}
    else if(keys['arrowright']||keys['d']){p.vx=2.6;p.facing=1}
    else p.vx*=0.55;
    if(!p.onGround)p.vy+=0.42;
    else p.vy=0;
    // Jump only with Space — Up is climb when on ladder
    if((keys[' ']||keys['space'])&&p.onGround){p.vy=-7.5;p.onGround=false;p.onLadder=false}
  }
  const prevBottom=p.y+p.h;
  p.x+=p.vx;
  p.y+=p.vy;
  if(p.x<0)p.x=0;if(p.x+p.w>W)p.x=W-p.w;

  // land on platforms
  p.onGround=false;
  if(!p.onLadder&&p.vy>=0){
    const plat=onPlatform(p.x,p.y,p.w,p.h,prevBottom);
    if(plat){
      p.y=plat.y-p.h;
      p.vy=0;
      p.onGround=true;
    }
  }
  // also stick if already standing (small sink correction)
  if(!p.onLadder&&p.vy>=0){
    for(const pl of PLATS){
      if(p.x+p.w>pl.x+4&&p.x<pl.x+pl.w-4){
        const feet=p.y+p.h;
        if(feet>=pl.y&&feet<=pl.y+10){
          p.y=pl.y-p.h;p.vy=0;p.onGround=true;break;
        }
      }
    }
  }
  // bottom floor safety - never fall out of game, respawn on bottom platform
  if(p.y+p.h>H-5){
    p.y=PLATS[0].y-p.h;p.vy=0;p.onGround=true;
  }
  if(p.y>H+80){hit()}

  // goal
  if(p.x+p.w>GOAL.x&&p.x<GOAL.x+GOAL.w&&p.y+p.h>GOAL.y&&p.y<GOAL.y+GOAL.h){
    score+=Math.floor(500*cfg.scoreMul);won=true;state='win';saveLB(playerName,score);return;
  }

  // barrels
  spawnT+=dt;
  if(spawnT>cfg.spawn){
    spawnT=0;
    barrels.push({x:boss.x+40,y:boss.y+30,vx:cfg.barrelSpeed*(Math.random()>0.3?1:-1),vy:0,r:10,rolling:true});
  }
  for(let i=barrels.length-1;i>=0;i--){
    const b=barrels[i];
    b.vy+=0.25;b.x+=b.vx;b.y+=b.vy;
    const bPrev=b.y+b.r;
    let landed=false;
    for(const pl of PLATS){
      if(b.x>pl.x&&b.x<pl.x+pl.w&&b.vy>=0&&bPrev-b.vy<=pl.y+2&&b.y+b.r>=pl.y){
        b.y=pl.y-b.r;b.vy=0;landed=true;
        if(Math.abs(b.vx)<0.5)b.vx=cfg.barrelSpeed*(Math.random()>0.5?1:-1);
        break;
      }
    }
    // bounce edges of platforms roughly
    if(b.x<8||b.x>W-8)b.vx*=-1;
    // ladder drop chance
    const bl=onLadder(b.x-4,b.y,8,8);
    if(bl&&Math.random()<0.02){b.vx=0;b.vy=2}
    if(b.y>H+20){barrels.splice(i,1);score+=Math.floor(5*cfg.scoreMul);continue}
    // hit player
    if(Math.abs(b.x-(p.x+p.w/2))<p.w/2+b.r-2&&Math.abs(b.y-(p.y+p.h/2))<p.h/2+b.r-2){
      hit();
      return;
    }
  }
  score+=cfg.scoreMul*0.05;
}

function hit(){
  if(state!=='playing')return;
  lives--;
  if(lives<=0){state='gameOver';saveLB(playerName,score);return}
  resetLevel();
  state='respawn';
  respawnT=2.0;
}

function drawPixelPerson(x,y,color,facing){
  ctx.fillStyle=color;
  ctx.fillRect(x+4,y,10,8); // head
  ctx.fillRect(x+2,y+8,14,12); // body
  ctx.fillRect(x+(facing>0?12:0),y+10,6,4); // arm
  ctx.fillRect(x+3,y+20,5,8);ctx.fillRect(x+10,y+20,5,8); // legs
}

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  // stars / dots
  ctx.fillStyle='#222';
  for(let i=0;i<30;i++)ctx.fillRect((i*73)%W,(i*97)%H,2,2);

  if(state==='menu'){
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f55';ctx.font='bold 34px Segoe UI';ctx.textAlign='center';ctx.fillText('BARREL CLIMB',W/2,70);
    ctx.fillStyle='#8b95a8';ctx.font='13px Segoe UI';ctx.fillText('Klim naar de top, ontwijk de vaten!',W/2,100);
    ctx.fillStyle='#8b95a8';ctx.font='14px Segoe UI';ctx.fillText('JOUW NAAM',W/2,130);
    ctx.fillStyle=nameFocused?'#111':'#1a1a1a';ctx.fillRect(90,145,300,35);
    ctx.strokeStyle=nameFocused?'#ff0':'#f55';ctx.lineWidth=2;ctx.strokeRect(90,145,300,35);
    ctx.fillStyle='#f55';ctx.font='18px Segoe UI';
    ctx.fillText((nameInput||'')+(nameFocused&&Math.floor(Date.now()/500)%2?'|':'')||'Klik om naam in te vullen',W/2,169);
    ctx.fillStyle='#aaa';ctx.font='13px Segoe UI';ctx.fillText('DIFFICULTY',W/2,200);
    [['easy','#2ecc71',100],['medium','#f1c40f',190],['hard','#e74c3c',280]].forEach(([d,col,x])=>{
      const sel=difficulty===d;
      ctx.fillStyle=sel?col:'#222';ctx.fillRect(x,210,90,40);
      ctx.strokeStyle=col;ctx.lineWidth=sel?3:1;ctx.strokeRect(x,210,90,40);
      ctx.fillStyle=sel?'#000':col;ctx.font='bold 14px Segoe UI';ctx.fillText(DIFFS[d].label,x+45,236);
    });
    ctx.fillStyle='#a00';ctx.fillRect(140,280,200,50);ctx.strokeStyle='#f55';ctx.strokeRect(140,280,200,50);
    ctx.fillStyle='#f55';ctx.font='bold 22px Segoe UI';ctx.fillText('▶ START',W/2,313);
    ctx.fillStyle='#08a';ctx.fillRect(140,345,200,40);ctx.strokeStyle='#0ff';ctx.strokeRect(140,345,200,40);
    ctx.fillStyle='#0ff';ctx.font='bold 15px Segoe UI';ctx.fillText('< home',W/2,371);
    const lb=loadLB();
    if(lb.length){ctx.fillStyle='#ff0';ctx.font='bold 13px Segoe UI';ctx.fillText('TOP 5',W/2,420);
      lb.slice(0,5).forEach((e,i)=>{ctx.fillStyle=i===0?'#ff0':'#888';ctx.font='12px Segoe UI';
        ctx.fillText((i+1)+'. '+e.name+'  '+e.score+(e.diff?' ['+e.diff+']':''),W/2,440+i*16)})}
    return;
  }

  // platforms
  PLATS.forEach(p=>{
    ctx.fillStyle='#8b3a4a';ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='#a05060';
    for(let i=0;i<p.w;i+=16)ctx.fillRect(p.x+i,p.y,8,3);
  });
  // ladders
  LADDERS.forEach(l=>{
    ctx.strokeStyle='#6af';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(l.x,l.y+l.h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(l.x+12,l.y);ctx.lineTo(l.x+12,l.y+l.h);ctx.stroke();
    ctx.strokeStyle='#8cf';ctx.lineWidth=2;
    for(let yy=l.y+6;yy<l.y+l.h;yy+=10){
      ctx.beginPath();ctx.moveTo(l.x,yy);ctx.lineTo(l.x+12,yy);ctx.stroke();
    }
  });
  // goal / princess placeholder
  ctx.fillStyle='#f8a';ctx.fillRect(GOAL.x+8,GOAL.y,16,12);
  ctx.fillStyle='#e8e';ctx.fillRect(GOAL.x+10,GOAL.y+12,12,16);
  ctx.fillStyle='#ff0';ctx.font='10px Segoe UI';ctx.textAlign='center';ctx.fillText('★',GOAL.x+20,GOAL.y-4);

  // boss (ape)
  ctx.fillStyle='#a65';
  ctx.fillRect(boss.x,boss.y+10,36,28);
  ctx.fillRect(boss.x+6,boss.y,24,14);
  ctx.fillStyle='#fca';ctx.fillRect(boss.x+10,boss.y+6,16,8);
  ctx.fillStyle='#000';ctx.fillRect(boss.x+12,boss.y+8,4,4);ctx.fillRect(boss.x+20,boss.y+8,4,4);
  // barrels pile
  ctx.fillStyle='#c60';ctx.fillRect(boss.x-20,boss.y+20,16,18);ctx.fillRect(boss.x-18,boss.y+14,12,8);

  // barrels
  barrels.forEach(b=>{
    ctx.fillStyle='#c60';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#840';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r-3,0,Math.PI*2);ctx.stroke();
  });

  // player
  drawPixelPerson(player.x,player.y,'#4af',player.facing);
  ctx.fillStyle='#fc4';ctx.fillRect(player.x+5,player.y-4,8,4); // hat

  // HUD
  ctx.fillStyle='#fff';ctx.font='bold 16px Segoe UI';ctx.textAlign='left';
  ctx.fillText('SCORE '+Math.floor(score),12,24);
  ctx.fillText('LIVES '+lives,12,44);
  ctx.fillStyle='#f55';ctx.fillText(DIFFS[difficulty].label,W-80,24);

  if(state==='respawn'){
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f55';ctx.font='bold 42px Segoe UI';ctx.textAlign='center';
    ctx.fillText('OUCH!',W/2,H/2-40);
    ctx.fillStyle='#fff';ctx.font='22px Segoe UI';
    ctx.fillText('Lives left: '+lives,W/2,H/2+10);
    ctx.fillStyle='#ff0';ctx.font='18px Segoe UI';
    ctx.fillText('Respawn in '+Math.ceil(Math.max(0,respawnT))+'…',W/2,H/2+50);
    ctx.fillStyle='#8b95a8';ctx.font='14px Segoe UI';
    ctx.fillText('Klik of SPACE om meteen te respawnen',W/2,H/2+90);
  }

  if(state==='gameOver'||state==='win'){
    ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle=state==='win'?'#0f0':'#e74c3c';
    ctx.font='bold 40px Segoe UI';ctx.textAlign='center';
    ctx.fillText(state==='win'?'YOU WIN!':'GAME OVER',W/2,140);
    ctx.fillStyle='#fff';ctx.font='20px Segoe UI';ctx.fillText(playerName+' — '+Math.floor(score),W/2,185);
    ctx.fillStyle='#ff0';ctx.font='bold 16px Segoe UI';ctx.fillText('LEADERBOARD',W/2,230);
    loadLB().slice(0,6).forEach((e,i)=>{
      ctx.fillStyle=e.name===playerName&&e.score===Math.floor(score)?'#0f0':(i===0?'#ff0':'#aaa');
      ctx.font='14px Segoe UI';
      ctx.fillText((i+1)+'. '+e.name+'  '+e.score+(e.diff?' ['+e.diff+']':''),W/2,260+i*22);
    });
    ctx.fillStyle='#f55';ctx.font='16px Segoe UI';ctx.fillText('Klik / SPACE → Menu',W/2,480);
  }
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
