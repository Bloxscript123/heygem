<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><title>Orbit Dodge – heygemm</title>
<style>
body{margin:0;background:#0a0c10;color:#e8ecf4;font-family:Segoe UI,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
canvas{border:2px solid #1e2633;border-radius:12px;background:#0d1118;box-shadow:0 0 40px #6cf44}
.back-home{position:fixed;top:16px;left:16px;background:rgba(0,0,0,.75);color:#6cf;border:1px solid #6cf;padding:8px 14px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;z-index:100;cursor:pointer}
#info{margin-top:12px;color:#8b95a8;font-size:13px;text-align:center;max-width:520px}
</style></head><body>
<a class="back-home" href="../index.html">< home</a>
<canvas id="c" width="480" height="560"></canvas>
<div id="info">← → draaien • Spatie boost • pak Shield / Slow / 2x</div>
<script>
const WEBSITE_HOME='../index.html';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=560;
const _mem={};
function storageGet(k){try{return localStorage.getItem(k)}catch(e){return _mem[k]||null}}
function storageSet(k,v){try{localStorage.setItem(k,v)}catch(e){_mem[k]=String(v)}}

const LB_KEY='heygemm_orbit_leaderboard';
function loadLB(){try{return JSON.parse(storageGet(LB_KEY)||'[]')}catch{return[]}}
function saveLB(n,sc){n=(n||'Anoniem').trim();let lb=loadLB();const p=lb.find(e=>(e.name||'').toLowerCase()===n.toLowerCase());if(p&&Math.floor(sc)<=p.score)return lb;lb=lb.filter(e=>(e.name||'').toLowerCase()!==n.toLowerCase());lb.push({name:n,score:Math.floor(sc),diff:difficulty,date:Date.now()});lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,10);storageSet(LB_KEY,JSON.stringify(lb));return lb}
const DIFFS={easy:{label:'EASY',spd:1.2},medium:{label:'MEDIUM',spd:1.8},hard:{label:'HARD',spd:2.6}};
const PTYPES=[{id:'shield',label:'SHD',color:'#f80',dur:5},{id:'slow',label:'SLOW',color:'#a0f',dur:4},{id:'double',label:'2x',color:'#ff0',dur:6}];
let difficulty=storageGet('heygemm_orbit_diff')||'medium';
let state='menu',score=0,angle=0,radius=90,meteors=[],pickups=[],powers={shield:0,slow:0,double:0},keys={},t=0,playerName=storageGet('heygemm_player_name')||'',nameInput=playerName,nameFocused=false;
function reset(){score=0;angle=0;radius=90;meteors=[];pickups=[];powers={shield:0,slow:0,double:0};t=0}
function start(){playerName=(nameInput.trim()||'Anoniem').slice(0,12);storageSet('heygemm_player_name',playerName);storageSet('heygemm_orbit_diff',difficulty);reset();state='playing'}
window.addEventListener('keydown',e=>{if(state==='menu'&&nameFocused){if(e.key==='Enter'){nameFocused=false;return}if(e.key==='Backspace'){nameInput=nameInput.slice(0,-1);return}if(e.key.length===1&&nameInput.length<12)nameInput+=e.key;return}if(state==='menu'&&(e.key==='Enter'||e.key===' '))start();if(state==='gameOver'&&(e.key===' '||e.key==='Enter'))state='menu';keys[e.key.toLowerCase()]=true});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.onclick=ev=>{const r=canvas.getBoundingClientRect(),mx=(ev.clientX-r.left)*(W/r.width),my=(ev.clientY-r.top)*(H/r.height);if(state==='menu'){if(my>140&&my<175)nameFocused=true;else nameFocused=false;[['easy',80],['medium',190],['hard',300]].forEach(([d,x])=>{if(mx>x&&mx<x+90&&my>200&&my<240)difficulty=d});if(mx>140&&mx<340&&my>270&&my<320)start();if(mx>140&&mx<340&&my>340&&my<380)location.href=WEBSITE_HOME}if(state==='gameOver')state='menu'};
function loop(){requestAnimationFrame(loop);ctx.fillStyle='#050810';ctx.fillRect(0,0,W,H);
if(state==='menu'){ctx.fillStyle='#6cf';ctx.font='bold 32px Segoe UI';ctx.textAlign='center';ctx.fillText('ORBIT DODGE',W/2,70);ctx.fillStyle='#8b95a8';ctx.font='12px Segoe UI';ctx.fillText('Abilities: Shield • Slow • 2x Score',W/2,100);ctx.fillStyle='#888';ctx.font='14px Segoe UI';ctx.fillText('JOUW NAAM',W/2,130);ctx.fillStyle='#1a1a1a';ctx.fillRect(90,140,300,35);ctx.strokeStyle='#6cf';ctx.strokeRect(90,140,300,35);ctx.fillStyle='#6cf';ctx.font='18px Segoe UI';ctx.fillText(nameInput+(nameFocused?'|':''),W/2,164);[['easy','#2ecc71',80],['medium','#f1c40f',190],['hard','#e74c3c',300]].forEach(([d,c,x])=>{ctx.fillStyle=difficulty===d?c:'#222';ctx.fillRect(x,200,90,40);ctx.fillStyle=difficulty===d?'#000':c;ctx.font='bold 14px Segoe UI';ctx.fillText(DIFFS[d].label,x+45,226)});ctx.fillStyle='#068';ctx.fillRect(140,270,200,50);ctx.fillStyle='#6cf';ctx.font='bold 22px Segoe UI';ctx.fillText('START',W/2,303);ctx.fillStyle='#08a';ctx.fillRect(140,340,200,40);ctx.fillStyle='#0ff';ctx.font='bold 15px Segoe UI';ctx.fillText('< home',W/2,366);return}
if(state==='playing'){const cfg=DIFFS[difficulty];const dt=0.016;t+=dt;for(const k of Object.keys(powers))if(powers[k]>0)powers[k]=Math.max(0,powers[k]-dt);
 const slow=powers.slow>0?0.5:1;score+=(cfg.spd*(powers.double>0?2:1))*slow;
 if(keys['a']||keys['arrowleft'])angle-=0.07*cfg.spd;if(keys['d']||keys['arrowright'])angle+=0.07*cfg.spd;
 if(keys[' ']||keys['space'])radius=Math.min(180,radius+2);else radius=Math.max(70,radius-1.2);
 if(Math.random()<0.02*cfg.spd*slow){const a=Math.random()*Math.PI*2;meteors.push({a,r:220,spd:(1.5+Math.random()*cfg.spd)*slow,size:6+Math.random()*8})}
 if(Math.random()<0.008){const a=Math.random()*Math.PI*2;const pt=PTYPES[Math.floor(Math.random()*PTYPES.length)];pickups.push({a,r:200,...pt})}
 const px=W/2+Math.cos(angle)*radius,py=H/2+Math.sin(angle)*radius;
 for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.r-=m.spd*cfg.spd;const mx=W/2+Math.cos(m.a)*m.r,my=H/2+Math.sin(m.a)*m.r;if(m.r<20){meteors.splice(i,1);continue}if(Math.hypot(mx-px,my-py)<m.size+10){if(powers.shield>0){powers.shield=0;meteors.splice(i,1)}else{state='gameOver';saveLB(playerName,score)}}}
 for(let i=pickups.length-1;i>=0;i--){const u=pickups[i];u.r-=1.2;const ux=W/2+Math.cos(u.a)*u.r,uy=H/2+Math.sin(u.a)*u.r;if(u.r<30){pickups.splice(i,1);continue}if(Math.hypot(ux-px,uy-py)<18){powers[u.id]=u.dur;pickups.splice(i,1)}}
 ctx.strokeStyle='#1a3a5a';ctx.beginPath();ctx.arc(W/2,H/2,60,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#4af';ctx.beginPath();ctx.arc(W/2,H/2,40,0,Math.PI*2);ctx.fill();
 meteors.forEach(m=>{const mx=W/2+Math.cos(m.a)*m.r,my=H/2+Math.sin(m.a)*m.r;ctx.fillStyle='#f84';ctx.beginPath();ctx.arc(mx,my,m.size,0,Math.PI*2);ctx.fill()});
 pickups.forEach(u=>{const ux=W/2+Math.cos(u.a)*u.r,uy=H/2+Math.sin(u.a)*u.r;ctx.fillStyle=u.color;ctx.beginPath();ctx.arc(ux,uy,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.font='bold 8px Segoe UI';ctx.textAlign='center';ctx.fillText(u.label.slice(0,3),ux,uy+3)});
 if(powers.shield>0){ctx.strokeStyle='#f80';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,16,0,Math.PI*2);ctx.stroke()}
 ctx.fillStyle='#0ff';ctx.beginPath();ctx.arc(px,py,10,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='bold 18px Segoe UI';ctx.textAlign='left';ctx.fillText(Math.floor(score),12,28);
 let py2=50;for(const [k,v] of Object.entries(powers)){if(v<=0)continue;const info=PTYPES.find(p=>p.id===k);ctx.fillStyle=info.color;ctx.fillRect(W-120,py2,110*(v/info.dur),16);ctx.fillStyle='#000';ctx.font='10px Segoe UI';ctx.textAlign='center';ctx.fillText(info.label,W-65,py2+12);py2+=22}}
if(state==='gameOver'){ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f55';ctx.font='bold 36px Segoe UI';ctx.textAlign='center';ctx.fillText('CRASH',W/2,200);ctx.fillStyle='#fff';ctx.font='20px Segoe UI';ctx.fillText(playerName+' — '+Math.floor(score),W/2,250);ctx.fillStyle='#6cf';ctx.fillText('SPACE → menu',W/2,320)}}
requestAnimationFrame(loop);

</script></body></html>
