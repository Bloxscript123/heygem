<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><title>Gravity Flip – heygemm</title>
<style>body{margin:0;background:#0a0c10;color:#e8ecf4;font-family:Segoe UI,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
canvas{border:2px solid #1e2633;border-radius:12px;background:#0d1118;box-shadow:0 0 40px #8cf44}
.back-home{position:fixed;top:16px;left:16px;background:rgba(0,0,0,.75);color:#8cf;border:1px solid #8cf;padding:8px 14px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;z-index:100;cursor:pointer}
#info{margin-top:12px;color:#8b95a8;font-size:13px;text-align:center;max-width:520px}</style></head><body>
<a class="back-home" href="../index.html">< home</a>
<canvas id="c" width="480" height="560"></canvas><div id="info">Spatie = flip • meer obstakels (ook midden) • Shield / Slow / Safe</div>
<script>const WEBSITE_HOME='../index.html';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');const W=480,H=560;
const _mem={};function storageGet(k){try{return localStorage.getItem(k)}catch(e){return _mem[k]||null}}function storageSet(k,v){try{localStorage.setItem(k,v)}catch(e){_mem[k]=String(v)}}

const LB_KEY='heygemm_gravity_leaderboard';
function loadLB(){try{return JSON.parse(storageGet(LB_KEY)||'[]')}catch{return[]}}
function saveLB(n,sc){n=(n||'Anoniem').trim();let lb=loadLB();const p=lb.find(e=>(e.name||'').toLowerCase()===n.toLowerCase());if(p&&Math.floor(sc)<=p.score)return lb;lb=lb.filter(e=>(e.name||'').toLowerCase()!==n.toLowerCase());lb.push({name:n,score:Math.floor(sc),diff:difficulty,date:Date.now()});lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,10);storageSet(LB_KEY,JSON.stringify(lb));return lb}
const DIFFS={easy:{label:'EASY',spd:3},medium:{label:'MEDIUM',spd:4.2},hard:{label:'HARD',spd:5.5}};
const PTYPES=[{id:'shield',label:'SHD',color:'#f80',dur:4},{id:'slow',label:'SLOW',color:'#a0f',dur:5},{id:'magnet',label:'SAFE',color:'#0f0',dur:3}];
let difficulty=storageGet('heygemm_gravity_diff')||'medium';
let state='menu',score=0,y=280,vy=0,grav=1,spikes=[],mids=[],pickups=[],powers={shield:0,slow:0,magnet:0},keys={},playerName=storageGet('heygemm_player_name')||'',nameInput=playerName,nameFocused=false;
function reset(){score=0;y=280;vy=0;grav=1;spikes=[];mids=[];pickups=[];powers={shield:0,slow:0,magnet:0};
for(let i=0;i<18;i++)spikes.push({x:350+i*150,side:Math.random()>0.5?1:-1});
for(let i=0;i<12;i++)mids.push({x:500+i*220,y:120+Math.random()*280,w:18+Math.random()*20,h:18+Math.random()*40,vy:(Math.random()-0.5)*1.2})}
function start(){playerName=(nameInput.trim()||'Anoniem').slice(0,12);storageSet('heygemm_player_name',playerName);storageSet('heygemm_gravity_diff',difficulty);reset();state='playing'}
window.addEventListener('keydown',e=>{if(state==='menu'&&nameFocused){if(e.key==='Enter'){nameFocused=false;return}if(e.key==='Backspace'){nameInput=nameInput.slice(0,-1);return}if(e.key.length===1&&nameInput.length<12)nameInput+=e.key;return}if(state==='menu'&&(e.key==='Enter'||e.key===' '))start();if(state==='gameOver'&&(e.key===' '||e.key==='Enter'))state='menu';if(state==='playing'&&(e.key===' '||e.key==='Spacebar')){grav*=-1;vy=0}keys[e.key.toLowerCase()]=true;e.preventDefault()});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.onclick=ev=>{const r=canvas.getBoundingClientRect(),mx=(ev.clientX-r.left)*(W/r.width),my=(ev.clientY-r.top)*(H/r.height);if(state==='menu'){if(my>140&&my<175)nameFocused=true;else nameFocused=false;[['easy',80],['medium',190],['hard',300]].forEach(([d,x])=>{if(mx>x&&mx<x+90&&my>200&&my<240)difficulty=d});if(mx>140&&mx<340&&my>270&&my<320)start();if(mx>140&&mx<340&&my>340&&my<380)location.href=WEBSITE_HOME}if(state==='gameOver')state='menu'};
function loop(){requestAnimationFrame(loop);ctx.fillStyle='#0a1020';ctx.fillRect(0,0,W,H);
if(state==='menu'){ctx.fillStyle='#8cf';ctx.font='bold 32px Segoe UI';ctx.textAlign='center';ctx.fillText('GRAVITY FLIP',W/2,70);ctx.fillStyle='#8b95a8';ctx.font='12px Segoe UI';ctx.fillText('Abilities: Shield • Slow • Safe zone',W/2,100);ctx.fillStyle='#888';ctx.font='14px Segoe UI';ctx.fillText('JOUW NAAM',W/2,130);ctx.fillStyle='#1a1a1a';ctx.fillRect(90,140,300,35);ctx.strokeStyle='#8cf';ctx.strokeRect(90,140,300,35);ctx.fillStyle='#8cf';ctx.font='18px Segoe UI';ctx.fillText(nameInput+(nameFocused?'|':''),W/2,164);[['easy','#2ecc71',80],['medium','#f1c40f',190],['hard','#e74c3c',300]].forEach(([d,c,x])=>{ctx.fillStyle=difficulty===d?c:'#222';ctx.fillRect(x,200,90,40);ctx.fillStyle=difficulty===d?'#000':c;ctx.font='bold 14px Segoe UI';ctx.fillText(DIFFS[d].label,x+45,226)});ctx.fillStyle='#048';ctx.fillRect(140,270,200,50);ctx.fillStyle='#8cf';ctx.font='bold 22px Segoe UI';ctx.fillText('START',W/2,303);ctx.fillStyle='#08a';ctx.fillRect(140,340,200,40);ctx.fillStyle='#0ff';ctx.font='bold 15px Segoe UI';ctx.fillText('< home',W/2,366);return}
if(state==='playing'){const cfg=DIFFS[difficulty];const dt=0.016;for(const k of Object.keys(powers))if(powers[k]>0)powers[k]=Math.max(0,powers[k]-dt);
 const spd=cfg.spd*(powers.slow>0?0.55:1);score+=spd*0.4;vy+=grav*0.45;y+=vy;if(y<30){y=30;vy=0}if(y>H-50){y=H-50;vy=0}
 if(Math.random()<0.008){const pt=PTYPES[Math.floor(Math.random()*PTYPES.length)];pickups.push({x:W+20,y:60+Math.random()*(H-120),vy:0,...pt})}
 pickups.forEach(u=>u.x-=spd);pickups=pickups.filter(u=>u.x>-20);
 for(let i=pickups.length-1;i>=0;i--){const u=pickups[i];if(Math.abs(u.x-80)<20&&Math.abs(u.y-y)<24){powers[u.id]=u.dur;pickups.splice(i,1)}}
 spikes.forEach(s=>{s.x-=spd;if(s.x<-20){s.x+=15*150;s.side=Math.random()>0.5?1:-1}const sy=s.side>0?H-40:40;if(Math.abs(s.x-80)<20&&Math.abs(y-sy)<25){if(powers.shield>0||powers.magnet>0){if(powers.shield>0)powers.shield=0}else{state='gameOver';saveLB(playerName,score)}}});
 // mid obstacles
 mids.forEach(m=>{m.x-=spd;m.y+=m.vy;if(m.y<50||m.y>H-50)m.vy*=-1;if(m.x<-40){m.x+=12*220;m.y=80+Math.random()*360;m.w=16+Math.random()*24;m.h=16+Math.random()*50;m.vy=(Math.random()-0.5)*1.5}
  if(80+24>m.x&&80<m.x+m.w&&y+12>m.y&&y-12<m.y+m.h){if(powers.shield>0||powers.magnet>0){if(powers.shield>0)powers.shield=0;m.x=-50}else{state='gameOver';saveLB(playerName,score)}}});
 ctx.fillStyle='#1a2a40';ctx.fillRect(0,0,W,30);ctx.fillRect(0,H-30,W,30);
 spikes.forEach(s=>{ctx.fillStyle='#f45';const sy=s.side>0?H-30:30;ctx.beginPath();if(s.side>0){ctx.moveTo(s.x,sy);ctx.lineTo(s.x-12,sy-24);ctx.lineTo(s.x+12,sy-24)}else{ctx.moveTo(s.x,sy);ctx.lineTo(s.x-12,sy+24);ctx.lineTo(s.x+12,sy+24)}ctx.fill()});
 mids.forEach(m=>{ctx.fillStyle='#e74c3c';ctx.fillRect(m.x,m.y,m.w,m.h);ctx.fillStyle='#ff8080';ctx.fillRect(m.x+2,m.y+2,m.w-4,4)});
 pickups.forEach(u=>{ctx.fillStyle=u.color;ctx.beginPath();ctx.arc(u.x,u.y,10,0,Math.PI*2);ctx.fill()});
 if(powers.shield>0){ctx.strokeStyle='#f80';ctx.lineWidth=3;ctx.strokeRect(66,y-14,28,28)}
 ctx.fillStyle='#0ff';ctx.fillRect(68,y-12,24,24);ctx.fillStyle='#fff';ctx.font='bold 18px Segoe UI';ctx.textAlign='left';ctx.fillText(Math.floor(score),12,55);
 let py=70;for(const [k,v] of Object.entries(powers)){if(v<=0)continue;const info=PTYPES.find(p=>p.id===k);ctx.fillStyle=info.color;ctx.fillRect(W-120,py,110*(v/info.dur),16);ctx.fillStyle='#000';ctx.font='10px Segoe UI';ctx.textAlign='center';ctx.fillText(info.label,W-65,py+12);py+=22}}
if(state==='gameOver'){ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f55';ctx.font='bold 36px Segoe UI';ctx.textAlign='center';ctx.fillText('SPIKED',W/2,200);ctx.fillStyle='#fff';ctx.font='20px Segoe UI';ctx.fillText(playerName+' — '+Math.floor(score),W/2,250);ctx.fillStyle='#8cf';ctx.fillText('SPACE → menu',W/2,320)}}
requestAnimationFrame(loop);
</script></body></html>
