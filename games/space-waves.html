<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Space Waves – heygemm</title>
<style>
  body{margin:0;background:#05060a;color:#e8ecf4;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
  canvas{border:2px solid #1e2633;border-radius:12px;background:#05060a;box-shadow:0 0 50px rgba(120,80,255,.25)}
  .back-home{position:fixed;top:16px;left:16px;background:rgba(0,0,0,.75);color:#b8f;border:1px solid #b8f;padding:8px 14px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;z-index:100;cursor:pointer}
  .back-home:hover{background:rgba(180,140,255,.2)}
  #info{margin-top:12px;color:#8b95a8;font-size:13px;text-align:center;max-width:520px}
</style>
</head>
<body>
<a class="back-home" id="navBtn" href="../index.html">< home</a>
<canvas id="c" width="400" height="640"></canvas>
<div id="info">← → / A D of <b>muis</b> = sturen • <b>Spatie</b> = boost • ontwijk randen én obstakels</div>
<script>
const WEBSITE_HOME='../index.html';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=400,H=640;
const _mem={};
function storageGet(k){try{return localStorage.getItem(k)}catch(e){return _mem[k]||null}}
function storageSet(k,v){try{localStorage.setItem(k,v)}catch(e){_mem[k]=String(v)}}
const LB_KEY='heygemm_waves_leaderboard';
function loadLB(){try{return JSON.parse(storageGet(LB_KEY)||'[]')}catch{return[]}}
function saveLB(name,sc){
  name=(name||'Anoniem').trim();let lb=loadLB();
  const prev=lb.find(e=>(e.name||'').toLowerCase()===name.toLowerCase());
  const best=Math.floor(sc);if(prev&&best<=(prev.score||0))return lb;
  lb=lb.filter(e=>(e.name||'').toLowerCase()!==name.toLowerCase());
  lb.push({name,score:best,diff:difficulty,date:Date.now()});
  lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,10);
  storageSet(LB_KEY,JSON.stringify(lb));return lb;
}
const DIFFS={
  easy:{label:'EASY',speed:2.8,accel:0.0012,maxSpeed:7.5,gap:175,scoreMul:0.8},
  medium:{label:'MEDIUM',speed:3.6,accel:0.0018,maxSpeed:9.5,gap:155,scoreMul:1},
  hard:{label:'HARD',speed:4.6,accel:0.0026,maxSpeed:12,gap:135,scoreMul:1.5}
};
let difficulty=storageGet('heygemm_waves_diff')||'medium';
if(!DIFFS[difficulty])difficulty='medium';

let state='menu',score=0,shipX,shipY,shipR=10,keys={},mouseX=W/2,mouseActive=false,segments=[],obstacles=[],dist=0,speed=0,baseSpeed=0,hue=200,dead=false,shake=0,grace=0,boost=0,obsTimer=0;
let playerName=storageGet('heygemm_player_name')||'',nameInput=playerName,nameFocused=false;
let particles=[];

function resetGame(){
  const cfg=DIFFS[difficulty];
  shipX=W/2;shipY=H*0.72;shipR=10;score=0;dist=0;speed=cfg.speed;hue=200;dead=false;shake=0;particles=[];
  mouseActive=false;mouseX=W/2;grace=2.0;boost=0;baseSpeed=cfg.speed;obstacles=[];obsTimer=0;
  segments=[];
  let cx=W/2;
  // start with a long straight section so you don't crash instantly
  for(let i=0;i<40;i++){
    if(i>12){
      cx+=Math.sin(i*0.28)*14+(Math.random()-0.5)*8;
      cx=Math.max(cfg.gap/2+24,Math.min(W-cfg.gap/2-24,cx));
    }
    // wider gap at the start
    const g=i<15?cfg.gap+30:cfg.gap;
    segments.push({y:H-i*28,cx,gap:g});
  }
}
function goMenu(){state='menu'}
function goWebsite(){location.href=WEBSITE_HOME}
function startGame(){
  playerName=(nameInput.trim()||'Anoniem').slice(0,12);
  storageSet('heygemm_player_name',playerName);
  storageSet('heygemm_waves_diff',difficulty);
  resetGame();state='playing';
}
document.getElementById('navBtn').onclick=e=>{e.preventDefault();goWebsite()};

window.addEventListener('keydown',e=>{
  if(state==='menu'&&nameFocused){
    if(e.key==='Enter'){nameFocused=false;e.preventDefault();return}
    if(e.key==='Backspace'){nameInput=nameInput.slice(0,-1);e.preventDefault();return}
    if(e.key.length===1&&nameInput.length<12){nameInput+=e.key;e.preventDefault()}
    return;
  }
  if(state==='menu'&&(e.key==='Enter'||e.key===' ')){startGame();e.preventDefault();return}
  if(state==='gameOver'&&(e.key==='Enter'||e.key===' '||e.key==='r')){goMenu();return}
  keys[e.key.toLowerCase()]=true;
  if(['arrowleft','arrowright','a','d',' '].includes(e.key.toLowerCase()))e.preventDefault();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('mousemove',ev=>{
  const r=canvas.getBoundingClientRect();
  mouseX=(ev.clientX-r.left)*(W/r.width);
  if(state==='playing')mouseActive=true;
});
canvas.addEventListener('click',ev=>{
  const r=canvas.getBoundingClientRect(),mx=(ev.clientX-r.left)*(W/r.width),my=(ev.clientY-r.top)*(H/r.height);
  if(state==='menu'){
    if(mx>50&&mx<350&&my>150&&my<185){nameFocused=true;return}
    nameFocused=false;
    [['easy',40],['medium',155],['hard',270]].forEach(([d,x])=>{if(mx>x&&mx<x+90&&my>210&&my<250){difficulty=d;storageSet('heygemm_waves_diff',d)}});
    if(mx>100&&mx<300&&my>280&&my<330)startGame();
    if(mx>100&&mx<300&&my>345&&my<385)goWebsite();
  }
  if(state==='gameOver')goMenu();
});

function update(dt){
  if(state!=='playing')return;
  const cfg=DIFFS[difficulty];
  const move=speed*60*dt;
  dist+=move;
  score+=move*0.15*cfg.scoreMul;
  hue=(hue+dt*20)%360;

  // boost with Space
  if(keys[' ']||keys['space']){
    boost=Math.min(1,boost+dt*3);
  } else {
    boost=Math.max(0,boost-dt*2);
  }
  const cfgSp=DIFFS[difficulty];
  baseSpeed=Math.min(cfgSp.maxSpeed, baseSpeed+cfgSp.accel*60*dt);
  speed=baseSpeed*(1+boost*0.85);

  // steer — WASD / arrows sneller
  let target=shipX;
  const turn=520*dt; // was 280 — sneller sturen
  if(keys['arrowleft']||keys['a'])target-=turn;
  if(keys['arrowright']||keys['d'])target+=turn;
  // mouse only after you actually move it during play
  if(mouseActive)target+=(mouseX-shipX)*0.16;
  shipX+=(target-shipX)*Math.min(1,16*dt); // snellere response
  shipX=Math.max(shipR+4,Math.min(W-shipR-4,shipX));

  if(grace>0)grace-=dt;

  // scroll segments down (world moves down, ship stays)
  for(const s of segments)s.y+=move;
  // recycle
  while(segments.length&&segments[0].y>H+40)segments.shift();
  while(segments.length<45){
    const last=segments[segments.length-1];
    let cx=last.cx+Math.sin(dist*0.015+segments.length*0.35)*16+(Math.random()-0.5)*10;
    const gap=Math.max(100,cfg.gap-dist*0.0012);
    cx=Math.max(gap/2+20,Math.min(W-gap/2-20,cx));
    segments.push({y:last.y-28,cx,gap});
  }

  // scroll obstacles
  for(const o of obstacles)o.y+=move;
  obstacles=obstacles.filter(o=>o.y<H+30);

  // spawn small obstacles inside the tunnel
  obsTimer+=dt;
  // more obstacles over time
  const spawnEvery=Math.max(0.28,0.85-dist*0.0002);
  if(obsTimer>spawnEvery&&grace<=0){
    obsTimer=0;
    let segRef=null;
    for(const seg of segments){if(seg.y<50&&seg.y>-30){segRef=seg;break}}
    if(!segRef&&segments.length)segRef=segments[segments.length-1];
    if(segRef){
      const margin=20;
      const left=segRef.cx-segRef.gap/2+margin,right=segRef.cx+segRef.gap/2-margin;
      if(right>left+16){
        // sometimes spawn 2 side by side
        const count=Math.random()<0.35?2:1;
        for(let n=0;n<count;n++){
          const ox=left+Math.random()*(right-left);
          const r=6+Math.random()*5;
          obstacles.push({x:ox,y:segRef.y-(n*18),r,rot:Math.random()*6});
        }
      }
    }
  }

  // collision walls (skip during grace)
  if(grace<=0){
    for(const s of segments){
      if(Math.abs(s.y-shipY)<16){
        const pad=4;
        const left=s.cx-s.gap/2+pad,right=s.cx+s.gap/2-pad;
        if(shipX-shipR<left||shipX+shipR>right){
          dead=true;shake=12;state='gameOver';saveLB(playerName,score);
          for(let i=0;i<24;i++)particles.push({x:shipX,y:shipY,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:30,col:`hsl(${hue},100%,60%)`});
          return;
        }
      }
    }
    // collision obstacles
    for(const o of obstacles){
      const dx=shipX-o.x,dy=shipY-o.y;
      if(dx*dx+dy*dy<(shipR+o.r-2)*(shipR+o.r-2)){
        dead=true;shake=12;state='gameOver';saveLB(playerName,score);
        for(let i=0;i<24;i++)particles.push({x:shipX,y:shipY,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:30,col:'#f55'});
        return;
      }
    }
  }
  // trail particles
  if(Math.random()<0.5)particles.push({x:shipX+(Math.random()-0.5)*6,y:shipY+10,vx:(Math.random()-0.5)*0.5,vy:2+Math.random(),life:20,col:`hsl(${hue},90%,55%)`});
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});
  particles=particles.filter(p=>p.life>0);
  if(shake>0)shake*=0.9;
}

function draw(){
  ctx.fillStyle='#05060a';ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='#fff';
  for(let i=0;i<50;i++){
    const sx=(i*97+dist*0.3)%W,sy=(i*53+dist*0.8)%H;
    ctx.globalAlpha=0.15+((i*13)%10)/30;
    ctx.fillRect(sx,sy,1.5,1.5);
  }
  ctx.globalAlpha=1;

  if(state==='menu'){
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#c8f';ctx.font='bold 34px Segoe UI';ctx.textAlign='center';ctx.fillText('SPACE WAVES',W/2,80);
    ctx.fillStyle='#8b95a8';ctx.font='13px Segoe UI';ctx.fillText('Surf de neon-golven. Blijf in de tunnel.',W/2,115);
    ctx.fillStyle='#aaa';ctx.font='14px Segoe UI';ctx.fillText('JOUW NAAM',W/2,140);
    ctx.fillStyle=nameFocused?'#111':'#1a1a1a';ctx.fillRect(50,150,300,35);
    ctx.strokeStyle=nameFocused?'#0ff':'#b8f';ctx.lineWidth=2;ctx.strokeRect(50,150,300,35);
    ctx.fillStyle='#b8f';ctx.font='18px Segoe UI';
    ctx.fillText((nameInput||'')+(nameFocused&&Math.floor(Date.now()/500)%2?'|':'')||'Klik om naam in te vullen',W/2,174);
    ctx.fillStyle='#aaa';ctx.font='13px Segoe UI';ctx.fillText('DIFFICULTY',W/2,202);
    [['easy','#2ecc71',40],['medium','#f1c40f',155],['hard','#e74c3c',270]].forEach(([d,col,x])=>{
      const sel=difficulty===d;ctx.fillStyle=sel?col:'#222';ctx.fillRect(x,210,90,40);
      ctx.strokeStyle=col;ctx.lineWidth=sel?3:1;ctx.strokeRect(x,210,90,40);
      ctx.fillStyle=sel?'#000':col;ctx.font='bold 14px Segoe UI';ctx.fillText(DIFFS[d].label,x+45,236);
    });
    ctx.fillStyle='#40a';ctx.fillRect(100,280,200,50);ctx.strokeStyle='#b8f';ctx.strokeRect(100,280,200,50);
    ctx.fillStyle='#c8f';ctx.font='bold 22px Segoe UI';ctx.fillText('▶ START',W/2,313);
    ctx.fillStyle='#08a';ctx.fillRect(100,345,200,40);ctx.strokeStyle='#0ff';ctx.strokeRect(100,345,200,40);
    ctx.fillStyle='#0ff';ctx.font='bold 15px Segoe UI';ctx.fillText('< home',W/2,371);
    const lb=loadLB();
    if(lb.length){ctx.fillStyle='#ff0';ctx.font='bold 13px Segoe UI';ctx.fillText('TOP 5',W/2,430);
      lb.slice(0,5).forEach((e,i)=>{ctx.fillStyle=i===0?'#ff0':'#888';ctx.font='12px Segoe UI';
        ctx.fillText((i+1)+'. '+e.name+'  '+e.score+(e.diff?' ['+e.diff+']':''),W/2,450+i*16)})}
    return;
  }

  ctx.save();
  if(shake>0.5)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  // tunnel walls
  ctx.beginPath();
  for(let i=0;i<segments.length;i++){
    const s=segments[i];
    if(i===0)ctx.moveTo(s.cx-s.gap/2,s.y);else ctx.lineTo(s.cx-s.gap/2,s.y);
  }
  for(let i=segments.length-1;i>=0;i--){
    const s=segments[i];
    ctx.lineTo(s.cx+s.gap/2,s.y);
  }
  ctx.closePath();
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,`hsla(${hue},80%,40%,0.15)`);
  grad.addColorStop(1,`hsla(${(hue+40)%360},80%,50%,0.25)`);
  ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle=`hsl(${hue},100%,60%)`;ctx.lineWidth=3;ctx.shadowColor=`hsl(${hue},100%,50%)`;ctx.shadowBlur=12;ctx.stroke();
  ctx.shadowBlur=0;
  // outer dark
  ctx.fillStyle='#05060a';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
  ctx.moveTo(segments[0].cx-segments[0].gap/2,segments[0].y);
  for(let i=0;i<segments.length;i++)ctx.lineTo(segments[i].cx-segments[i].gap/2,segments[i].y);
  for(let i=segments.length-1;i>=0;i--)ctx.lineTo(segments[i].cx+segments[i].gap/2,segments[i].y);
  ctx.closePath();ctx.fill('evenodd');

  // particles
  particles.forEach(p=>{ctx.globalAlpha=p.life/30;ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,3,3)});
  ctx.globalAlpha=1;

  // obstacles
  for(const o of obstacles){
    ctx.save();
    ctx.translate(o.x,o.y);
    ctx.rotate(o.rot+dist*0.02);
    // red laser look
    ctx.shadowColor='#ff2040';
    ctx.shadowBlur=16;
    ctx.fillStyle='#ff2a4a';
    ctx.beginPath();
    ctx.moveTo(0,-o.r);ctx.lineTo(o.r*0.7,0);ctx.lineTo(0,o.r);ctx.lineTo(-o.r*0.7,0);ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#ff8090';
    ctx.lineWidth=1.5;
    ctx.stroke();
    // bright core
    ctx.shadowBlur=0;
    ctx.fillStyle='#ffc0c8';
    ctx.beginPath();ctx.arc(0,0,o.r*0.25,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // ship
  if(state==='playing'){
    ctx.save();
    ctx.translate(shipX,shipY);
    ctx.fillStyle=`hsl(${hue},100%,70%)`;
    ctx.shadowColor=`hsl(${hue},100%,60%)`;ctx.shadowBlur=16;
    ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(12,12);ctx.lineTo(0,6);ctx.lineTo(-12,12);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-2,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // HUD
  ctx.fillStyle='#fff';ctx.font='bold 20px Segoe UI';ctx.textAlign='left';
  ctx.fillText(Math.floor(score),16,32);
  ctx.fillStyle=`hsl(${hue},80%,60%)`;ctx.font='12px Segoe UI';
  ctx.fillText(DIFFS[difficulty].label,16,50);
  // boost bar
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(W-120,16,100,12);
  ctx.fillStyle=boost>0.05?`hsl(${hue},100%,60%)`:'#333';
  ctx.fillRect(W-120,16,100*boost,12);
  ctx.strokeStyle='#666';ctx.strokeRect(W-120,16,100,12);
  ctx.fillStyle='#aaa';ctx.font='10px Segoe UI';ctx.textAlign='right';
  ctx.fillText('BOOST',W-24,42);

  if(state==='gameOver'){
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f55';ctx.font='bold 36px Segoe UI';ctx.textAlign='center';ctx.fillText('CRASHED',W/2,180);
    ctx.fillStyle='#fff';ctx.font='20px Segoe UI';ctx.fillText(playerName+' — '+Math.floor(score),W/2,225);
    ctx.fillStyle='#ff0';ctx.font='bold 16px Segoe UI';ctx.fillText('LEADERBOARD',W/2,270);
    loadLB().slice(0,6).forEach((e,i)=>{
      ctx.fillStyle=e.name===playerName&&e.score===Math.floor(score)?'#0f0':(i===0?'#ff0':'#aaa');
      ctx.font='14px Segoe UI';
      ctx.fillText((i+1)+'. '+e.name+'  '+e.score+(e.diff?' ['+e.diff+']':''),W/2,300+i*22);
    });
    ctx.fillStyle='#b8f';ctx.font='16px Segoe UI';ctx.fillText('Klik / SPACE → Menu',W/2,H-50);
  }
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
