<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Space Blaster – heygemm</title>
<style>
  body{margin:0;background:#050810;color:#e8ecf4;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
  canvas{border:2px solid #1e2633;border-radius:12px;background:#070b14;box-shadow:0 0 40px rgba(0,200,255,.12)}
  .back-home{position:fixed;top:16px;left:16px;background:rgba(0,0,0,.75);color:#0ff;border:1px solid #0ff;padding:8px 14px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;z-index:100;cursor:pointer}
  .back-home:hover{background:rgba(0,255,255,.15)}
  #info{margin-top:12px;color:#8b95a8;font-size:13px;text-align:center;max-width:480px}
</style>
</head>
<body>
<a class="back-home" id="navBtn" href="../index.html">< home</a>
<canvas id="c" width="480" height="560"></canvas>
<div id="info">A D / pijltjes = bewegen • Spatie = schieten • abilities: Rapid, Shield, Triple, Bomb</div>
<script>
const WEBSITE_HOME='../index.html';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=560;
const _mem={};
function storageGet(k){try{return localStorage.getItem(k)}catch(e){return _mem[k]||null}}
function storageSet(k,v){try{localStorage.setItem(k,v)}catch(e){_mem[k]=String(v)}}
const LB_KEY='heygemm_space_leaderboard';
function loadLB(){try{return JSON.parse(storageGet(LB_KEY)||'[]')}catch{return[]}}
function saveLB(name,sc){name=(name||'Anoniem').trim();let lb=loadLB();const low=name.toLowerCase();const prev=lb.find(e=>(e.name||'').toLowerCase()===low);const best=Math.floor(sc);if(prev&&best<=(prev.score||0))return lb;lb=lb.filter(e=>(e.name||'').toLowerCase()!==low);lb.push({name:name,score:best,date:Date.now()});lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,10);storageSet(LB_KEY,JSON.stringify(lb));return lb}
const PTYPES=[{id:'rapid',label:'RAPID',color:'#0ff',dur:6},{id:'shield',label:'SHIELD',color:'#f80',dur:5},{id:'triple',label:'TRIPLE',color:'#ff0',dur:7},{id:'bomb',label:'BOMB',color:'#f0f',dur:0}];
let state='menu',score=0,player,bullets,enemies,particles,pickups,keys={},frame=0,spawnTimer=0;
let powers={rapid:0,shield:0,triple:0};
let playerName=storageGet('heygemm_player_name')||'',nameInput=playerName,nameFocused=false,lastShot=0;
function resetGame(){player={x:W/2,y:H-50,w:36,h:20,speed:5};bullets=[];enemies=[];particles=[];pickups=[];score=0;frame=0;spawnTimer=0;powers={rapid:0,shield:0,triple:0}}
function goMenu(){state='menu'}
function goWebsite(){location.href=WEBSITE_HOME}
function startGame(){playerName=(nameInput.trim()||'Anoniem').slice(0,12);storageSet('heygemm_player_name',playerName);resetGame();state='playing'}
document.getElementById('navBtn').onclick=e=>{e.preventDefault();goWebsite()};
window.addEventListener('keydown',e=>{
  if(state==='menu'&&nameFocused){if(e.key==='Enter'){nameFocused=false;e.preventDefault();return}if(e.key==='Backspace'){nameInput=nameInput.slice(0,-1);e.preventDefault();return}if(e.key.length===1&&nameInput.length<12){nameInput+=e.key;e.preventDefault()}return}
  if(state==='menu'&&(e.key==='Enter'||e.key===' ')){startGame();e.preventDefault();return}
  if(state==='gameOver'&&(e.key==='Enter'||e.key===' '||e.key==='r')){goMenu();return}
  keys[e.key.toLowerCase()]=true;if(['arrowleft','arrowright','a','d',' '].includes(e.key.toLowerCase()))e.preventDefault();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('click',ev=>{
  const r=canvas.getBoundingClientRect(),mx=(ev.clientX-r.left)*(W/r.width),my=(ev.clientY-r.top)*(H/r.height);
  if(state==='menu'){if(mx>90&&mx<390&&my>160&&my<195){nameFocused=true;return}nameFocused=false;if(mx>140&&mx<340&&my>250&&my<305)startGame();if(mx>140&&mx<340&&my>320&&my<360)goWebsite()}
  if(state==='gameOver')goMenu();
});
function shoot(){const now=performance.now();const cd=powers.rapid>0?90:220;if(now-lastShot<cd)return;lastShot=now;bullets.push({x:player.x,y:player.y-15,vy:-9});if(powers.triple>0){bullets.push({x:player.x-14,y:player.y-10,vy:-8.5,vx:-1.2});bullets.push({x:player.x+14,y:player.y-10,vy:-8.5,vx:1.2})}}
function spawnPickup(x,y){if(Math.random()>0.28)return;const t=PTYPES[Math.floor(Math.random()*PTYPES.length)];pickups.push({x,y,vy:1.5,...t})}
function update(dt){
  if(state!=='playing')return;frame++;
  for(const k of Object.keys(powers))if(powers[k]>0)powers[k]=Math.max(0,powers[k]-dt);
  if(keys['arrowleft']||keys['a'])player.x-=player.speed;if(keys['arrowright']||keys['d'])player.x+=player.speed;
  player.x=Math.max(20,Math.min(W-20,player.x));if(keys[' ']||keys['space'])shoot();
  bullets.forEach(b=>{b.y+=b.vy;if(b.vx)b.x+=b.vx});bullets=bullets.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);
  spawnTimer+=dt;const interval=Math.max(0.35,1.15-frame/2500);
  if(spawnTimer>interval){spawnTimer=0;enemies.push({x:40+Math.random()*(W-80),y:-20,w:28,h:22,vy:1.2+Math.random()*1.5+frame/3500,hp:1})}
  enemies.forEach(en=>en.y+=en.vy);
  for(let i=enemies.length-1;i>=0;i--){
    const en=enemies[i];
    for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.abs(b.x-en.x)<en.w/2+4&&Math.abs(b.y-en.y)<en.h/2+4){bullets.splice(j,1);en.hp--;score+=25;for(let p=0;p<6;p++)particles.push({x:en.x,y:en.y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:20,color:'#0ff'});if(en.hp<=0){spawnPickup(en.x,en.y);enemies.splice(i,1);score+=50}break}}
    if(en.y>H+30){enemies.splice(i,1);continue}
    if(Math.abs(en.x-player.x)<(en.w+player.w)/2&&Math.abs(en.y-player.y)<(en.h+player.h)/2){
      if(powers.shield>0){enemies.splice(i,1);score+=30;for(let p=0;p<10;p++)particles.push({x:en.x,y:en.y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:25,color:'#f80'})}
      else{state='gameOver';saveLB(playerName,score);for(let p=0;p<20;p++)particles.push({x:player.x,y:player.y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:40,color:'#f44'})}
    }
  }
  for(let i=pickups.length-1;i>=0;i--){const u=pickups[i];u.y+=u.vy;if(Math.abs(u.x-player.x)<22&&Math.abs(u.y-player.y)<22){if(u.id==='bomb'){enemies.forEach(en=>{score+=40;for(let p=0;p<5;p++)particles.push({x:en.x,y:en.y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:20,color:'#f0f'})});enemies=[]}else if(u.dur>0)powers[u.id]=u.dur;pickups.splice(i,1)}else if(u.y>H+20)pickups.splice(i,1)}
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});particles=particles.filter(p=>p.life>0);
}
function draw(){
  ctx.fillStyle='#070b14';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,0.35)';
  for(let i=0;i<40;i++){const sx=(i*97+frame*0.2)%W,sy=(i*53+frame*0.5)%H;ctx.fillRect(sx,sy,1.5,1.5)}
  if(state==='menu'){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0cf';ctx.font='bold 34px Segoe UI';ctx.textAlign='center';ctx.fillText('SPACE BLASTER',W/2,80);
    ctx.fillStyle='#8b95a8';ctx.font='12px Segoe UI';ctx.fillText('Abilities: Rapid • Shield • Triple • Bomb',W/2,112);
    ctx.fillStyle='#8b95a8';ctx.font='14px Segoe UI';ctx.fillText('JOUW NAAM',W/2,145);
    ctx.fillStyle=nameFocused?'#111':'#1a1a1a';ctx.fillRect(90,160,300,35);ctx.strokeStyle=nameFocused?'#0ff':'#0cf';ctx.lineWidth=2;ctx.strokeRect(90,160,300,35);
    ctx.fillStyle='#0ff';ctx.font='18px Segoe UI';ctx.fillText((nameInput||'')+(nameFocused&&Math.floor(Date.now()/500)%2?'|':'')||'Klik om naam in te vullen',W/2,184);
    ctx.fillStyle='#068';ctx.fillRect(140,250,200,50);ctx.strokeStyle='#0cf';ctx.strokeRect(140,250,200,50);ctx.fillStyle='#0cf';ctx.font='bold 22px Segoe UI';ctx.fillText('START',W/2,283);
    ctx.fillStyle='#08a';ctx.fillRect(140,320,200,40);ctx.strokeStyle='#0ff';ctx.strokeRect(140,320,200,40);ctx.fillStyle='#0ff';ctx.font='bold 15px Segoe UI';ctx.fillText('< home',W/2,346);
    const lb=loadLB();if(lb.length){ctx.fillStyle='#ff0';ctx.font='bold 13px Segoe UI';ctx.fillText('TOP 5',W/2,400);lb.slice(0,5).forEach((e,i)=>{ctx.fillStyle=i===0?'#ff0':'#888';ctx.font='12px Segoe UI';ctx.fillText((i+1)+'. '+e.name+'  '+e.score,W/2,420+i*16)})}
    return;
  }
  ctx.fillStyle='#0cf';ctx.beginPath();ctx.moveTo(player.x,player.y-14);ctx.lineTo(player.x-18,player.y+10);ctx.lineTo(player.x+18,player.y+10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#0ff';ctx.fillRect(player.x-4,player.y+6,8,8);
  if(powers.shield>0){ctx.strokeStyle='rgba(255,140,0,0.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,28,0,Math.PI*2);ctx.stroke()}
  ctx.fillStyle='#ff0';bullets.forEach(b=>{ctx.fillRect(b.x-2,b.y-8,4,12)});
  enemies.forEach(en=>{ctx.fillStyle='#f45';ctx.fillRect(en.x-en.w/2,en.y-en.h/2,en.w,en.h);ctx.fillStyle='#faa';ctx.fillRect(en.x-6,en.y-4,12,6)});
  pickups.forEach(u=>{ctx.fillStyle=u.color+'55';ctx.beginPath();ctx.arc(u.x,u.y,14,0,Math.PI*2);ctx.fill();ctx.fillStyle=u.color;ctx.beginPath();ctx.arc(u.x,u.y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.font='bold 9px Segoe UI';ctx.textAlign='center';ctx.fillText(u.label.slice(0,3),u.x,u.y+3)});
  particles.forEach(p=>{ctx.globalAlpha=p.life/30;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.font='bold 18px Segoe UI';ctx.textAlign='left';ctx.fillText('SCORE  '+score,12,28);
  let py=50;for(const [k,v] of Object.entries(powers)){if(v<=0)continue;const info=PTYPES.find(p=>p.id===k);ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(W-120,py-14,110,22);ctx.fillStyle=info.color;ctx.fillRect(W-120,py-14,110*(v/info.dur),22);ctx.fillStyle='#000';ctx.font='bold 11px Segoe UI';ctx.textAlign='center';ctx.fillText(info.label+' '+v.toFixed(1)+'s',W-65,py+2);py+=26}
  if(state==='gameOver'){ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f44';ctx.font='bold 40px Segoe UI';ctx.textAlign='center';ctx.fillText('DESTROYED',W/2,140);ctx.fillStyle='#fff';ctx.font='20px Segoe UI';ctx.fillText(playerName+' — '+score,W/2,185);ctx.fillStyle='#ff0';ctx.font='bold 16px Segoe UI';ctx.fillText('LEADERBOARD',W/2,230);loadLB().slice(0,6).forEach((e,i)=>{ctx.fillStyle=e.name===playerName&&e.score===score?'#0f0':(i===0?'#ff0':'#aaa');ctx.font='14px Segoe UI';ctx.fillText((i+1)+'. '+e.name+'  '+e.score,W/2,260+i*22)});ctx.fillStyle='#0cf';ctx.font='16px Segoe UI';ctx.fillText('Klik / SPACE → Menu',W/2,480)}
}
let last=performance.now();function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
