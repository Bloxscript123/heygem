<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><title>Idle Clicker – heygemm</title>
<style>body{margin:0;background:#0a0c10;color:#e8ecf4;font-family:Segoe UI,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
canvas{border:2px solid #1e2633;border-radius:12px;background:#0d1118;box-shadow:0 0 40px #f1c40f44}
.back-home{position:fixed;top:16px;left:16px;background:rgba(0,0,0,.75);color:#f1c40f;border:1px solid #f1c40f;padding:8px 14px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;z-index:100;cursor:pointer}
#info{margin-top:12px;color:#8b95a8;font-size:13px;text-align:center;max-width:520px}</style></head><body>
<a class="back-home" href="../index.html">< home</a>
<canvas id="c" width="480" height="600"></canvas><div id="info">Klik voor coins • koop upgrades • progress wordt opgeslagen</div>
<script>const WEBSITE_HOME='../index.html';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');const W=480,H=600;
const _mem={};function storageGet(k){try{return localStorage.getItem(k)}catch(e){return _mem[k]||null}}function storageSet(k,v){try{localStorage.setItem(k,v)}catch(e){_mem[k]=String(v)}}

const LB_KEY='heygemm_idle_leaderboard';
function loadLB(){try{return JSON.parse(storageGet(LB_KEY)||'[]')}catch{return[]}}
function saveLB(n,sc){n=(n||'Anoniem').trim();let lb=loadLB();const p=lb.find(e=>(e.name||'').toLowerCase()===n.toLowerCase());if(p&&Math.floor(sc)<=p.score)return lb;lb=lb.filter(e=>(e.name||'').toLowerCase()!==n.toLowerCase());lb.push({name:n,score:Math.floor(sc),date:Date.now()});lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,10);storageSet(LB_KEY,JSON.stringify(lb));return lb}
let state='menu',coins=0,cps=0,clickP=1,upgrades=[{n:'Cursor',cost:15,cps:0.1,owned:0},{n:'Auto',cost:100,cps:1,owned:0},{n:'Farm',cost:500,cps:5,owned:0},{n:'Mine',cost:2000,cps:20,owned:0}],playerName=storageGet('heygemm_player_name')||'',nameInput=playerName,nameFocused=false;
function load(){try{const d=JSON.parse(storageGet('heygemm_idle_save')||'null');if(d){coins=d.coins||0;upgrades=d.upgrades||upgrades;recalc()}}catch{}}
function save(){storageSet('heygemm_idle_save',JSON.stringify({coins,upgrades}));saveLB(playerName,coins)}
function recalc(){cps=upgrades.reduce((s,u)=>s+u.cps*u.owned,0);clickP=1+upgrades[0].owned*0.5}
function start(){playerName=(nameInput.trim()||'Anoniem').slice(0,12);storageSet('heygemm_player_name',playerName);load();state='playing'}
window.addEventListener('keydown',e=>{if(state==='menu'&&nameFocused){if(e.key==='Enter'){nameFocused=false;return}if(e.key==='Backspace'){nameInput=nameInput.slice(0,-1);return}if(e.key.length===1&&nameInput.length<12)nameInput+=e.key;return}if(state==='menu'&&(e.key==='Enter'||e.key===' '))start()});
canvas.onclick=ev=>{const r=canvas.getBoundingClientRect(),mx=(ev.clientX-r.left)*(W/r.width),my=(ev.clientY-r.top)*(H/r.height);
 if(state==='menu'){if(my>140&&my<175)nameFocused=true;else nameFocused=false;if(mx>140&&mx<340&&my>220&&my<270)start();if(mx>140&&mx<340&&my>290&&my<330)location.href=WEBSITE_HOME}
 if(state==='playing'){if(my>180&&my<280&&mx>140&&mx<340){coins+=clickP;save()}
  upgrades.forEach((u,i)=>{const uy=320+i*50;if(mx>60&&mx<420&&my>uy&&my<uy+44&&coins>=u.cost){coins-=u.cost;u.owned++;u.cost=Math.floor(u.cost*1.35);recalc();save()}})}};
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.1,(now-last)/1000);last=now;ctx.fillStyle='#12161e';ctx.fillRect(0,0,W,H);
if(state==='menu'){ctx.fillStyle='#f1c40f';ctx.font='bold 32px Segoe UI';ctx.textAlign='center';ctx.fillText('IDLE CLICKER',W/2,80);ctx.fillStyle='#888';ctx.font='14px Segoe UI';ctx.fillText('JOUW NAAM',W/2,130);ctx.fillStyle='#1a1a1a';ctx.fillRect(90,140,300,35);ctx.strokeStyle='#f1c40f';ctx.strokeRect(90,140,300,35);ctx.fillStyle='#f1c40f';ctx.font='18px Segoe UI';ctx.fillText(nameInput+(nameFocused?'|':''),W/2,164);ctx.fillStyle='#640';ctx.fillRect(140,220,200,50);ctx.fillStyle='#f1c40f';ctx.font='bold 22px Segoe UI';ctx.fillText('START',W/2,253);ctx.fillStyle='#08a';ctx.fillRect(140,290,200,40);ctx.fillStyle='#0ff';ctx.font='bold 15px Segoe UI';ctx.fillText('< home',W/2,316);return}
if(state==='playing'){coins+=cps*dt;ctx.fillStyle='#f1c40f';ctx.font='bold 28px Segoe UI';ctx.textAlign='center';ctx.fillText(Math.floor(coins)+' coins',W/2,60);ctx.fillStyle='#888';ctx.font='14px Segoe UI';ctx.fillText(cps.toFixed(1)+' / sec',W/2,85);ctx.fillStyle='#2a2a10';ctx.fillRect(140,180,200,100);ctx.strokeStyle='#f1c40f';ctx.strokeRect(140,180,200,100);ctx.fillStyle='#f1c40f';ctx.font='bold 20px Segoe UI';ctx.fillText('CLICK +'+clickP.toFixed(1),W/2,240);
 upgrades.forEach((u,i)=>{const uy=320+i*50;ctx.fillStyle=coins>=u.cost?'#1a3a1a':'#1a1a1a';ctx.fillRect(60,uy,360,44);ctx.strokeStyle='#555';ctx.strokeRect(60,uy,360,44);ctx.fillStyle='#fff';ctx.font='14px Segoe UI';ctx.textAlign='left';ctx.fillText(u.n+' x'+u.owned+'  (+'+u.cps+'/s)',70,uy+28);ctx.textAlign='right';ctx.fillText(u.cost+'c',410,uy+28)})}}
requestAnimationFrame(loop);
</script></body></html>
